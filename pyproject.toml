[project]
name = "pydantic-stream"
version = "0.3.0"
description = "Rust-accelerated JSON streaming and projection for pydantic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nathan Gage", email = "nathan@sweetspotgov.com" },
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
]
keywords = ["pydantic", "json", "streaming", "rust", "projection"]
dependencies = [
    "pydantic>=2.11.0,<3.0.0",
]

[dependency-groups]
dev = [
    "hypothesis",
    "maturin>=1.7,<2.0",
    "pygal",
    "pygaljs",
    "pytest",
    "pytest-benchmark",
    "pytest-memray",
    "ruff",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/pydantic-stream-python/Cargo.toml"
python-source = "src"
module-name = "pydantic_stream._native"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "large_payload: mark heavy benchmark cases that should be selected explicitly",
]
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"benchmarks/**" = ["E501"]
"demo/**" = ["E501"]
